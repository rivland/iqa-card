name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catégorie « plugin » : c'est le nom interne de la catégorie Dashboard.
      - name: Validation HACS
        uses: hacs/action@main
        with:
          category: plugin
